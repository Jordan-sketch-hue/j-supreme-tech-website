<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="#ffffff" opacity="0.15"/>

  <!-- JST monogram -->
  <rect x="60" y="60" width="72" height="72" rx="14" fill="#ffffff"/>
  <text x="96" y="112" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="900" fill="#0a0a0a" text-anchor="middle" letter-spacing="-1">JST</text>

  <!-- Studio name -->
  <text x="155" y="89" font-family="'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="0">J Supreme Tech</text>
  <text x="155" y="112" font-family="'Courier New',monospace" font-size="10" font-weight="600" fill="#ffffff" opacity="0.4" letter-spacing="3">CREATIVE TECHNOLOGY</text>

  <!-- Main headline -->
  <text x="60" y="280" font-family="'Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-2">We build the systems.</text>
  <text x="60" y="360" font-family="'Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="#ffffff" opacity="0.3" letter-spacing="-2">You grow the brand.</text>

  <!-- Sub-copy -->
  <text x="60" y="430" font-family="'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#ffffff" opacity="0.55" letter-spacing="0">Websites · Apps · CRMs · Social Media · Brand Design · Digital Systems</text>

  <!-- Divider -->
  <rect x="60" y="465" width="120" height="2" fill="#ffffff" opacity="0.2"/>

  <!-- Stat pills -->
  <rect x="60" y="490" width="160" height="44" rx="22" fill="#ffffff" opacity="0.07"/>
  <text x="140" y="516" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">12+ Live Platforms</text>

  <rect x="236" y="490" width="148" height="44" rx="22" fill="#ffffff" opacity="0.07"/>
  <text x="310" y="516" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">13 SaaS Products</text>

  <rect x="400" y="490" width="172" height="44" rx="22" fill="#ffffff" opacity="0.07"/>
  <text x="486" y="516" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Jamaica → Worldwide</text>

  <!-- Domain -->
  <text x="1140" y="590" font-family="'Courier New',monospace" font-size="13" font-weight="600" fill="#ffffff" opacity="0.35" text-anchor="end" letter-spacing="1">JSUPREMETECH.ONLINE</text>
</svg>
