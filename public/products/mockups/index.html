<!DOCTYPE html>

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Product Mockups</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;font-family:'Inter',sans-serif;padding:40px 20px}
.product{margin-bottom:80px;text-align:center}
.product-label{color:#666;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:20px}

/* LAPTOP FRAME */
.laptop{display:inline-block;position:relative;width:800px}
.laptop-screen{background:#1a1a1a;border-radius:12px 12px 0 0;border:3px solid #333;padding:8px 8px 0;position:relative}
.laptop-camera{width:6px;height:6px;background:#333;border-radius:50%;margin:0 auto 6px;display:block}
.laptop-inner{width:100%;height:440px;border-radius:4px;overflow:hidden;position:relative;background:#fff}
.laptop-inner iframe{width:1280px;height:880px;transform:scale(0.578);transform-origin:top left;border:none;pointer-events:none}
.laptop-base{background:linear-gradient(180deg,#2a2a2a,#1a1a1a);height:18px;border-radius:0 0 4px 4px;border:3px solid #333;border-top:none}
.laptop-foot{background:#222;height:8px;width:85%;margin:0 auto;border-radius:0 0 8px 8px;border:2px solid #333;border-top:none}

/* PHONE FRAME */
.phone{display:inline-block;position:relative;width:220px;margin-left:40px;vertical-align:top;margin-top:20px}
.phone-body{background:#1a1a1a;border-radius:32px;border:4px solid #333;padding:12px 8px;position:relative;box-shadow:0 0 0 1px #444}
.phone-notch{width:60px;height:10px;background:#1a1a1a;border-radius:0 0 8px 8px;margin:0 auto 8px;border:2px solid #333;border-top:none}
.phone-inner{width:100%;height:400px;border-radius:16px;overflow:hidden;position:relative;background:#fff}
.phone-inner iframe{width:390px;height:844px;transform:scale(0.523);transform-origin:top left;border:none;pointer-events:none}
.phone-home{width:40px;height:4px;background:#333;border-radius:2px;margin:8px auto 0}

.pair{display:flex;align-items:flex-start;justify-content:center;gap:32px;flex-wrap:wrap}
</style>
</head>
