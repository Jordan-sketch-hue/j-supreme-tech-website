  <rect x="40" y="302" width="222" height="85" rx="10" fill="white" stroke="#ffe0e0" stroke-width="1"/>
  <rect x="290" y="302" width="222" height="85" rx="10" fill="white" stroke="#ffe0e0" stroke-width="1"/>
  <rect x="540" y="302" width="220" height="85" rx="10" fill="white" stroke="#ffe0e0" stroke-width="1"/>
