  <text x="60" y="196" font-family="Arial,sans-serif" font-size="10" fill="#ffffff88">Professional moving services with WiPay payments &amp; live tracking.</text>
  <rect x="60" y="214" width="115" height="28" rx="14" fill="#FF3B3B"/>
