  <text x="401" y="328" font-family="Arial,sans-serif" font-size="8" fill="#FF3B3B" text-anchor="middle" font-weight="700">OFFICE RELOCATION</text>
  <text x="650" y="328" font-family="Arial,sans-serif" font-size="8" fill="#FF3B3B" text-anchor="middle" font-weight="700">ONLINE STORE</text>
  <text x="151" y="348" font-family="Arial,sans-serif" font-size="7" fill="#888" text-anchor="middle">Residential moves islandwide</text>
  <text x="401" y="348" font-family="Arial,sans-serif" font-size="7" fill="#888" text-anchor="middle">Commercial &amp; corporate moves</text>
  <text x="650" y="348" font-family="Arial,sans-serif" font-size="7" fill="#888" text-anchor="middle">WiPay-powered e-commerce</text>
