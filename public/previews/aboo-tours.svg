  <rect x="30" y="270" width="224" height="130" rx="12" fill="#152840" stroke="#FFD70033" stroke-width="1"/>
  <rect x="30" y="270" width="224" height="50" rx="12" fill="#FFD700" opacity="0.15"/>
  <text x="142" y="300" font-family="Georgia,serif" font-size="10" fill="#FFD700" text-anchor="middle" font-weight="bold">Dunn's River Falls</text>
