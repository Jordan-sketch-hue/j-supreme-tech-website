  <text x="654" y="300" font-family="Georgia,serif" font-size="10" fill="#FFD700" text-anchor="middle" font-weight="bold">Private Island Tour</text>
  <text x="654" y="316" font-family="Arial,sans-serif" font-size="7" fill="#ffffff88" text-anchor="middle">Custom itinerary · full day</text>
  <text x="654" y="368" font-family="Arial Black,sans-serif" font-size="16" fill="white" text-anchor="middle">US$220</text>
